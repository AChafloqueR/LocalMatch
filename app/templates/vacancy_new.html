{% extends "base.html" %}{% block title %}Nueva convocatoria{% endblock %}
{% block content %}
<h1>Nueva convocatoria</h1><p class="sub">Define lo que busca el puesto. El agente usará estos criterios para ordenar los CV.</p>
<form class="card row" method="get" action="/vacancies/new">
  <label style="margin:0">Empezar desde una plantilla</label>
  <select name="plantilla" style="width:auto"><option value="">En blanco</option>{% for t in plantillas %}<option value="{{ t.slug }}" {{ 'selected' if t.slug == plantilla }}>{{ t.title }}</option>{% endfor %}</select>
  <button class="btn ghost small">Cargar plantilla</button>
</form>
<form class="card" method="post" action="/vacancies/new">
  {% include "_vacancy_form.html" %}
  <p><button class="btn">Crear convocatoria</button></p>
</form>
{% endblock %}
