{% extends "base.html" %}{% block title %}Nueva vacante{% endblock %}
{% block content %}
<h1>Nueva vacante</h1><p class="sub">Define lo que busca el puesto. El agente usará estos criterios para ordenar los CV.</p>
<form class="card" method="post" action="/vacancies/new">
  <label>Puesto</label><input type="text" name="title" required placeholder="Ej.: Analista de datos junior">
  <label>Área</label><input type="text" name="area" required placeholder="Ej.: Operaciones">
  <label>Descripción del puesto</label><textarea name="description" required placeholder="Funciones principales y contexto del puesto"></textarea>
  <label>Requisitos obligatorios <span class="hint">separados por comas</span></label>
  <input type="text" name="must" placeholder="Ej.: SQL, Excel, Power BI">
  <label>Requisitos deseables <span class="hint">separados por comas</span></label>
  <input type="text" name="nice" placeholder="Ej.: Python, ERP, inglés">
  <label>Años mínimos de experiencia</label><input type="number" name="min_years" min="0" step="0.5" value="1">
  <label>Jefe de área que decidirá</label>
  <select name="boss_id" required>{% for b in bosses %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}</select>
  <p><button class="btn">Crear vacante</button></p>
</form>
{% endblock %}
