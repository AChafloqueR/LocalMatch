# Plano de despliegue para Render (New > Blueprint). El servicio se llamará "localmatch".
services:
  - type: web
    name: localmatch
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # solo despliega cuando las pruebas de GitHub pasan
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "1"
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL          # cadena de conexión de Postgres (Supabase o Neon)
        sync: false
      - key: ADMIN_EMAIL           # correo del usuario de investigación
        sync: false
      - key: ADMIN_PASSWORD        # contraseña inicial (cámbiala después de ingresar)
        sync: false
